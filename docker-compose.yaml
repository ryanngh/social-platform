services:
  postgres:
    image: postgres:16-alpine
    container_name: social-network-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-social_network}
      POSTGRES_USER: ${POSTGRES_USER:-social_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-social_app} -d ${POSTGRES_DB:-social_network}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: